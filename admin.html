<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة منصة اختيار</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
margin:0;
background:#eef2f3;
}

.login{
width:90%;
max-width:400px;
margin:80px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px #ccc;
text-align:center;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
background:#0f766e;
color:white;
border:0;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:.8;
}

header{
background:#0f766e;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:15px;
}

.card{
background:white;
margin:15px 0;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.stat{
background:#fff;
padding:20px;
border-radius:15px;
text-align:center;
font-size:18px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#0f766e;
color:white;
}

.delete{
background:#c0392b;
}

.edit{
background:#2980b9;
}

.hidden{
display:none;
}

</style>

</head>


<body>


<div class="login" id="login">

<h2>🔐 دخول الإدارة</h2>

<input id="user" placeholder="اسم المستخدم">

<input id="pass" type="password" placeholder="كلمة السر">

<button onclick="login()">دخول</button>

<p id="msg" style="color:red"></p>

</div>



<div id="panel" class="hidden">


<header>
<h1>💍 منصة اختيار</h1>
<h3>لوحة الإدارة والمراقبة</h3>
</header>


<div class="container">


<div class="stats">

<div class="stat">
👥
<br>
المستخدمين
<h2 id="countUsers">0</h2>
</div>


<div class="stat">
💌
<br>
طلبات الزواج
<h2 id="countRequests">0</h2>
</div>


<div class="stat">
👁
<br>
الزيارات
<h2 id="countViews">0</h2>
</div>


</div>



<div class="card">

<h2>➕ إضافة مستخدم</h2>

<input id="name" placeholder="الاسم">

<input id="age" placeholder="العمر">

<select id="status">

<option>أعزب</option>
<option>متزوج</option>
<option>مطلق</option>

</select>


<button onclick="addUser()">
إضافة
</button>


</div>




<div class="card">

<h2>🔎 البحث</h2>

<input id="search" 
onkeyup="loadUsers()"
placeholder="ابحث بالاسم">


</div>





<div class="card">

<h2>👤 المستخدمين</h2>


<table id="table">

<tr>
<th>الاسم</th>
<th>العمر</th>
<th>الحالة</th>
<th>إجراء</th>
</tr>


</table>


</div>



<button onclick="logout()">
تسجيل خروج
</button>



</div>

</div>





<script>


let users =
JSON.parse(localStorage.getItem("members")) || [];




function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;


if(u=="admin" && p=="123456"){

localStorage.setItem("admin","yes");

show();

}

else{

document.getElementById("msg").innerHTML=
"بيانات الدخول خطأ";

}


}




function show(){

document.getElementById("login").classList.add("hidden");

document.getElementById("panel").classList.remove("hidden");

loadUsers();

}



function logout(){

localStorage.removeItem("admin");

location.reload();

}




if(localStorage.getItem("admin")=="yes"){

show();

}





function addUser(){

let name=
document.getElementById("name").value;


let age=
document.getElementById("age").value;


let status=
document.getElementById("status").value;



if(name==""){

alert("اكتب الاسم");

return;

}



users.push({

name:name,
age:age,
status:status

});



localStorage.setItem(
"members",
JSON.stringify(users)
);


document.getElementById("name").value="";

document.getElementById("age").value="";


loadUsers();


}





function loadUsers(){


let table=document.getElementById("table");


let search=
document.getElementById("search")?.value || "";



table.innerHTML=
`
<tr>
<th>الاسم</th>
<th>العمر</th>
<th>الحالة</th>
<th>إجراء</th>
</tr>
`;



users
.filter(x=>x.name.includes(search))
.forEach((u,i)=>{


table.innerHTML+=

`
<tr>

<td>${u.name}</td>

<td>${u.age}</td>

<td>${u.status}</td>


<td>

<button class="delete"
onclick="removeUser(${i})">
حذف
</button>


</td>


</tr>
`;



});



document.getElementById("countUsers").innerHTML=
users.length;


document.getElementById("countRequests").innerHTML=
localStorage.getItem("requests")||0;


document.getElementById("countViews").innerHTML=
localStorage.getItem("views")||0;


}




function removeUser(i){


if(confirm("حذف المستخدم؟")){


users.splice(i,1);


localStorage.setItem(
"members",
JSON.stringify(users)
);


loadUsers();


}


}



</script>

<script>

// تسجيل زيارة
let views = Number(localStorage.getItem("views") || 0);
views++;
localStorage.setItem("views", views);


// إرسال الاستمارة للإدارة
document.getElementById("visitor-form").addEventListener("submit",function(e){

e.preventDefault();


let member = {

id: Date.now(),

name: document.getElementById("v-name").value,

gender: document.getElementById("v-gender").value,

age: document.getElementById("v-age").value,

city: document.getElementById("v-city").value,

work: document.getElementById("v-work").value,

status: document.getElementById("v-status").value,

religion: document.getElementById("v-religion").value,

phone: document.getElementById("v-phone").value,

guardian:
document.getElementById("v-guardian-phone").value,

specs:
document.getElementById("v-specs").value,

state:"جديد"

};


// حفظ المستخدمين

let members =
JSON.parse(localStorage.getItem("members")) || [];


members.push(member);


localStorage.setItem(
"members",
JSON.stringify(members)
);


// تحديث الأعداد

localStorage.setItem(
"users",
members.length
);


let requests =
Number(localStorage.getItem("requests") || 0);

requests++;

localStorage.setItem(
"requests",
requests
);


// كود المتقدم

alert(
"تم تسجيل طلبك بنجاح\n\nكودك السري: MW-"+member.id+
"\nسيتم مراجعة البيانات من الإدارة."
);


this.reset();


});


// إظهار رقم ولي الأمر للفتاة

function toggleGuardianField(){

let gender =
document.getElementById("v-gender").value;


let input =
document.getElementById("v-guardian-phone");


if(gender=="female"){

input.required=true;

}else{

input.required=false;

}

}

</script>
</body>
</html>
