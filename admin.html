<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة إدارة منصة اختيار</title>

<style>
body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
}
header{
background:#0f766e;
color:white;
padding:20px;
text-align:center;
}
.container{
padding:20px;
}
.card{
background:white;
border-radius:15px;
padding:20px;
margin:15px 0;
box-shadow:0 3px 10px #ccc;
}
button{
background:#0f766e;
color:white;
border:0;
padding:10px 20px;
border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>لوحة إدارة منصة اختيار</h1>
<p>مراقبة وإدارة المنصة</p>
</header>


<div class="container">

<div class="card">
<h2>👥 المستخدمين</h2>
<p>عدد الأعضاء: <span id="users">0</span></p>
</div>


<div class="card">
<h2>💍 طلبات الزواج</h2>
<p>الطلبات الجديدة: <span id="requests">0</span></p>
</div>


<div class="card">
<h2>📊 الإحصائيات</h2>
<p>زيارات المنصة: <span id="views">0</span></p>
</div>


<div class="card">
<h2>⚙️ التحكم</h2>
<button onclick="alert('سيتم إضافة التحكم قريباً')">
فتح الإدارة
</button>
</div>


</div>


<script>

document.getElementById("users").innerHTML = 
localStorage.getItem("users") || 0;

document.getElementById("requests").innerHTML =
localStorage.getItem("requests") || 0;

document.getElementById("views").innerHTML =
localStorage.getItem("views") || 0;

</script>

</body>
</html>
