<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة منصة اختيار</title>

<style>
body{
font-family:Tahoma;
background:#f2f2f2;
margin:0;
}

.login, .dashboard{
max-width:400px;
margin:80px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;
text-align:center;
}

input{
width:90%;
padding:12px;
margin:8px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#0f766e;
color:white;
border:0;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
}

header{
background:#0f766e;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px;
border-radius:15px;
box-shadow:0 2px 8px #ccc;
}

</style>

</head>

<body>


<div class="login" id="loginBox">

<h2>🔐 دخول الإدارة</h2>

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة السر">

<button onclick="login()">دخول</button>

<p id="error" style="color:red"></p>

</div>



<div id="dashboard" style="display:none">

<header>
<h1>لوحة إدارة منصة اختيار</h1>
</header>


<div class="card">
<h2>👥 المستخدمين</h2>
<p>عدد المستخدمين: <span id="users">0</span></p>
</div>


<div class="card">
<h2>💍 طلبات الزواج</h2>
<p>الطلبات: <span id="requests">0</span></p>
</div>


<div class="card">
<h2>📊 الزيارات</h2>
<p>الزيارات: <span id="views">0</span></p>
</div>


<button onclick="logout()">خروج</button>


</div>



<script>

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;


// بيانات المدير مؤقتاً
if(user=="admin" && pass=="123456"){

localStorage.setItem("adminLogin","yes");

showDashboard();

}else{

document.getElementById("error").innerHTML=
"بيانات الدخول غير صحيحة";

}

}


function showDashboard(){

document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").style.display="block";


document.getElementById("users").innerHTML=
localStorage.getItem("users") || 0;

document.getElementById("requests").innerHTML=
localStorage.getItem("requests") || 0;

document.getElementById("views").innerHTML=
localStorage.getItem("views") || 0;

}


function logout(){

localStorage.removeItem("adminLogin");

location.reload();

}


if(localStorage.getItem("adminLogin")=="yes"){

showDashboard();

}

</script>


</body>
</html>
